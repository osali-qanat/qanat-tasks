<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت وظایف | صندوق قنات</title>
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f1f5f9; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Drag and drop specific styles */
        .kanban-column { min-height: 400px; transition: background-color 0.2s; }
        .kanban-column.drag-over { background-color: #f8fafc; border-color: #cbd5e1; }
        .task-card { cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .task-card:active { cursor: grabbing; }
        .task-card.dragging { opacity: 0.5; transform: scale(0.95); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- سیستم نمایش پیام -->
    <div id="toast-message" class="fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[100] text-sm font-bold transition-all duration-300 opacity-0 translate-y-[-2rem] pointer-events-none"></div>

    <!-- بخش احراز هویت -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4 min-h-screen">
        <div class="glass-panel p-8 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full relative overflow-hidden">
            <div id="connection-status" class="absolute top-0 left-0 w-full h-1 bg-amber-400 animate-pulse"></div>
            
            <div class="text-center mb-8 mt-2">
                <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-blue-200 transform rotate-3">
                    <i class="fa-solid fa-layer-group text-3xl text-white -rotate-3"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">مدیریت وظایف قنات</h2>
                <p class="text-slate-500 text-sm mt-2" id="login-subtitle">در حال برقراری ارتباط با هسته مرکزی...</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">ایمیل سازمانی</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="email" class="w-full border-2 border-slate-200 rounded-xl py-3 pr-10 pl-3 text-left focus:border-indigo-500 outline-none transition-all font-semibold" dir="ltr" value="osali5000@gmail.com" required disabled>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1.5">رمز عبور</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="password" class="w-full border-2 border-slate-200 rounded-xl py-3 pr-10 pl-3 text-left focus:border-indigo-500 outline-none transition-all" dir="ltr" placeholder="••••••••" required disabled>
                    </div>
                </div>
                <button type="submit" id="login-btn" class="w-full bg-slate-200 text-slate-400 font-bold rounded-xl p-3.5 transition-all duration-300 flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری سیستم...
                </button>
            </form>
        </div>
    </div>

    <!-- داشبورد اصلی -->
    <div id="main-dashboard" class="hidden flex-col flex-1 h-screen overflow-hidden fade-in bg-slate-50">
        
        <!-- هدر -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-chart-gantt"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-slate-800">بورد مدیریت وظایف صندوق</h1>
                    <p class="text-indigo-600 text-xs font-bold mt-0.5 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                        پایگاه داده آنلاین
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="openNewTaskModal()" class="hidden md:flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition-colors">
                    <i class="fa-solid fa-plus"></i> ایجاد کار جدید
                </button>
                <div class="h-8 w-px bg-slate-200 hidden md:block"></div>
                <div class="flex flex-col text-left hidden md:flex">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">مدیر سیستم</span>
                    <span id="user-email-display" class="font-bold text-slate-700 text-xs" dir="ltr">...</span>
                </div>
                <button onclick="handleLogout()" class="text-rose-500 hover:bg-rose-50 w-10 h-10 rounded-xl flex items-center justify-center transition border border-rose-100" title="خروج">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- کانبان بورد -->
        <main class="flex-1 overflow-x-auto overflow-y-hidden p-4 md:p-6 lg:p-8">
            <div class="flex gap-6 h-full min-w-max pb-4">
                
                <!-- ستون: برای انجام -->
                <div class="w-80 flex flex-col bg-slate-100/50 rounded-2xl border border-slate-200 h-full overflow-hidden">
                    <div class="p-4 border-b border-slate-200 bg-white/50 flex justify-between items-center shrink-0">
                        <h3 class="font-bold text-slate-700 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> برای انجام (To-Do)
                        </h3>
                        <span id="count-todo" class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 kanban-column" id="col-todo" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-status="todo">
                        <!-- کارت‌ها اینجا لود می‌شوند -->
                    </div>
                </div>

                <!-- ستون: در دست اقدام -->
                <div class="w-80 flex flex-col bg-indigo-50/30 rounded-2xl border border-indigo-100 h-full overflow-hidden">
                    <div class="p-4 border-b border-indigo-100 bg-indigo-50/50 flex justify-between items-center shrink-0">
                        <h3 class="font-bold text-indigo-900 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span> در دست اقدام
                        </h3>
                        <span id="count-inprogress" class="bg-indigo-200 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 kanban-column" id="col-inprogress" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-status="in_progress">
                        <!-- کارت‌ها اینجا لود می‌شوند -->
                    </div>
                </div>

                <!-- ستون: انجام شده -->
                <div class="w-80 flex flex-col bg-emerald-50/30 rounded-2xl border border-emerald-100 h-full overflow-hidden">
                    <div class="p-4 border-b border-emerald-100 bg-emerald-50/50 flex justify-between items-center shrink-0">
                        <h3 class="font-bold text-emerald-900 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> انجام شده / تایید
                        </h3>
                        <span id="count-done" class="bg-emerald-200 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 kanban-column" id="col-done" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-status="done">
                        <!-- کارت‌ها اینجا لود می‌شوند -->
                    </div>
                </div>

            </div>
        </main>

        <!-- دکمه شناور موبایل برای افزودن کار -->
        <button onclick="openNewTaskModal()" class="md:hidden fixed bottom-6 left-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg shadow-indigo-300 flex items-center justify-center text-2xl z-40">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- مودال افزودن کار جدید -->
    <div id="newTaskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden fade-in">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 text-lg">ایجاد وظیفه جدید</h3>
                <button onclick="closeNewTaskModal()" class="text-slate-400 hover:text-rose-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); submitNewTask();" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">عنوان کار</label>
                    <input type="text" id="taskTitle" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-indigo-500 outline-none font-medium" placeholder="مثال: بررسی پرونده وام آقای احمدی" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">دسته‌بندی</label>
                        <select id="taskCategory" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-indigo-500 outline-none">
                            <option value="مالی">مالی و حسابداری</option>
                            <option value="فنی">سیستم و فنی</option>
                            <option value="پشتیبانی">پشتیبانی اعضا</option>
                            <option value="جلسات">جلسات و مدیریت</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">اولویت</label>
                        <select id="taskPriority" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-indigo-500 outline-none">
                            <option value="عادی">🟢 عادی</option>
                            <option value="مهم">🟠 مهم</option>
                            <option value="فوری">🔴 فوری</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 border-t border-slate-100 flex gap-3">
                    <button type="submit" id="btn-submit-task" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-3 transition shadow">ثبت وظیفه</button>
                    <button type="button" onclick="closeNewTaskModal()" class="px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl py-3 transition">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <!-- اسکریپت‌های ارتباطی و منطق -->
    <script>
        // متغیرهای سراسری
        let supaClient = null;
        let tasksList = [];
        let currentUser = null;

        // سیستم مدیریت پیام (Toast)
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast-message');
            toast.innerHTML = message;
            
            if(type === 'error') toast.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[100] text-sm font-bold transition-all duration-300 opacity-100 translate-y-0 bg-rose-600 text-white border-2 border-rose-800';
            else if (type === 'success') toast.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[100] text-sm font-bold transition-all duration-300 opacity-100 translate-y-0 bg-emerald-600 text-white border-2 border-emerald-800';
            else toast.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[100] text-sm font-bold transition-all duration-300 opacity-100 translate-y-0 bg-indigo-600 text-white border-2 border-indigo-800';
            
            setTimeout(() => {
                toast.classList.replace('opacity-100', 'opacity-0');
                toast.classList.replace('translate-y-0', 'translate-y-[-2rem]');
            }, 3000);
        }

        // بارگذاری ناهمگام و ایمن کتابخانه Supabase
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.onload = () => {
            supaClient = window.supabase.createClient(
                'https://fsbfdyipycoeykmhiaox.supabase.co', 
                'sb_publishable_fSA7iR064z30VOjrjviaCg_AF7J7sYh'
            );
            
            // آماده‌سازی فرم ورود
            const btn = document.getElementById('login-btn');
            btn.disabled = false;
            btn.innerHTML = 'ورود به پنل مدیریت <i class="fa-solid fa-arrow-left mr-2"></i>';
            btn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl p-3.5 transition-all duration-300 flex items-center justify-center shadow-lg shadow-indigo-200 cursor-pointer";
            
            document.getElementById('email').disabled = false;
            document.getElementById('password').disabled = false;
            document.getElementById('login-subtitle').innerHTML = '<span class="text-emerald-500 font-bold"><i class="fa-solid fa-check-circle"></i> سیستم آماده ورود است</span>';
            document.getElementById('connection-status').className = "absolute top-0 left-0 w-full h-1 bg-emerald-500";

            // چک کردن سشن باز
            checkSession();
        };
        script.onerror = () => {
            showToast('خطا در بارگذاری کتابخانه اصلی. لطفا اتصال اینترنت را بررسی کنید.', 'error');
            document.getElementById('login-subtitle').innerHTML = '<span class="text-rose-500 font-bold">ارتباط با سرور مسدود است.</span>';
        };
        document.head.appendChild(script);

        // احراز هویت
        async function checkSession() {
            const { data: { session } } = await supaClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                initDashboard();
            }
        }

        async function handleLogin() {
            if(!supaClient) return showToast('سیستم هنوز آماده نیست!', 'error');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال اعتبارسنجی...';
            btn.disabled = true;

            try {
                const { data, error } = await supaClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                currentUser = data.user;
                showToast('ورود با موفقیت انجام شد', 'success');
                initDashboard();
            } catch (err) {
                showToast('خطا در ورود: ' + (err.message.includes('Invalid') ? 'رمز اشتباه است' : err.message), 'error');
                btn.innerHTML = 'ورود به پنل مدیریت <i class="fa-solid fa-arrow-left mr-2"></i>';
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            await supaClient.auth.signOut();
            document.getElementById('main-dashboard').classList.replace('flex', 'hidden');
            document.getElementById('auth-screen').classList.replace('hidden', 'flex');
            currentUser = null;
        }

        // منطق داشبورد
        function initDashboard() {
            document.getElementById('auth-screen').classList.replace('flex', 'hidden');
            document.getElementById('main-dashboard').classList.replace('hidden', 'flex');
            document.getElementById('user-email-display').innerText = currentUser.email;
            
            fetchTasks();
        }

        async function fetchTasks() {
            try {
                const { data, error } = await supaClient.from('tasks').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                
                tasksList = data;
                renderKanban();
            } catch (err) {
                showToast('خطا در دریافت لیست وظایف', 'error');
                console.error(err);
            }
        }

        function renderKanban() {
            const cols = {
                'todo': document.getElementById('col-todo'),
                'in_progress': document.getElementById('col-inprogress'),
                'done': document.getElementById('col-done')
            };
            
            cols.todo.innerHTML = ''; cols.in_progress.innerHTML = ''; cols.done.innerHTML = '';
            let counts = { todo: 0, in_progress: 0, done: 0 };

            tasksList.forEach(task => {
                // مپ کردن استاتوس‌های دیتابیس به ستون‌های کانبان
                let s = 'todo';
                if(task.status === 'در دست اقدام' || task.status === 'in_progress') s = 'in_progress';
                if(task.status === 'انجام شده' || task.status === 'done') s = 'done';
                
                counts[s]++;
                
                let priorityColor = 'text-emerald-600 bg-emerald-50 border-emerald-200';
                if(task.priority === 'مهم') priorityColor = 'text-amber-600 bg-amber-50 border-amber-200';
                if(task.priority === 'فوری') priorityColor = 'text-rose-600 bg-rose-50 border-rose-200';

                let dateStr = 'بدون تاریخ';
                if(task.created_at) dateStr = new Date(task.created_at).toLocaleDateString('fa-IR');

                const cardHTML = `
                    <div id="${task.id}" class="task-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-300 relative group" draggable="true" ondragstart="drag(event)">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${priorityColor}">${task.priority || 'عادی'}</span>
                            <span class="text-[10px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded"><i class="fa-solid fa-tag ml-1 text-slate-400"></i>${task.category || 'عمومی'}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm leading-relaxed mb-3">${task.title}</h4>
                        <div class="flex justify-between items-center text-[10px] text-slate-500 pt-2 border-t border-slate-100">
                            <span><i class="fa-regular fa-clock ml-1"></i> ${dateStr}</span>
                            <button onclick="deleteTask('${task.id}')" class="text-rose-400 hover:text-rose-600 transition p-1.5 rounded hover:bg-rose-50 opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                cols[s].innerHTML += cardHTML;
            });

            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-inprogress').innerText = counts.in_progress;
            document.getElementById('count-done').innerText = counts.done;
        }

        // منطق ایجاد کار جدید
        function openNewTaskModal() {
            document.getElementById('newTaskModal').classList.replace('hidden', 'flex');
        }
        function closeNewTaskModal() {
            document.getElementById('newTaskModal').classList.replace('flex', 'hidden');
            document.getElementById('taskTitle').value = '';
        }

        async function submitNewTask() {
            const title = document.getElementById('taskTitle').value;
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const btn = document.getElementById('btn-submit-task');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ثبت...'; 
            btn.disabled = true;

            try {
                const newTask = {
                    title: title,
                    category: category,
                    priority: priority,
                    status: 'todo',
                    task_code: 'TSK-' + Math.floor(Math.random() * 10000)
                };
                
                const { data, error } = await supaClient.from('tasks').insert([newTask]).select();
                if (error) throw error;
                
                showToast('وظیفه جدید ثبت شد', 'success');
                if(data && data.length > 0) {
                     tasksList.unshift(data[0]);
                }
                renderKanban();
                closeNewTaskModal();
            } catch (err) {
                showToast('خطا در ثبت وظیفه', 'error');
                console.error(err);
            } finally {
                btn.innerHTML = 'ثبت وظیفه'; btn.disabled = false;
            }
        }

        async function deleteTask(id) {
            // استفاده از confirm به دلیل عدم پشتیبانی از مودال کاستوم در این اسکوپ (ولی بهتر است در آینده به مودال تبدیل شود)
            if(!confirm('آیا از حذف این وظیفه مطمئن هستید؟')) return;
            try {
                const { error } = await supaClient.from('tasks').delete().eq('id', id);
                if (error) throw error;
                
                tasksList = tasksList.filter(t => t.id !== id);
                renderKanban();
                showToast('حذف با موفقیت انجام شد', 'info');
            } catch (err) {
                showToast('خطا در حذف وظیفه', 'error');
            }
        }

        // ====== منطق Drag and Drop ======
        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
            ev.target.classList.add('dragging');
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function dragEnter(ev) {
            ev.preventDefault();
            let col = ev.target.closest('.kanban-column');
            if(col) col.classList.add('drag-over');
        }

        function dragLeave(ev) {
            let col = ev.target.closest('.kanban-column');
            if(col) col.classList.remove('drag-over');
        }

        async function drop(ev) {
            ev.preventDefault();
            let col = ev.target.closest('.kanban-column');
            if(!col) return;
            
            col.classList.remove('drag-over');
            
            const taskId = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(taskId);
            if(draggedElement) draggedElement.classList.remove('dragging');
            
            const newStatus = col.getAttribute('data-status');
            
            const taskObj = tasksList.find(t => t.id === taskId);
            let oldStatus = 'todo';
            if(taskObj) {
                if(taskObj.status === 'در دست اقدام' || taskObj.status === 'in_progress') oldStatus = 'in_progress';
                if(taskObj.status === 'انجام شده' || taskObj.status === 'done') oldStatus = 'done';
            }

            if(oldStatus !== newStatus) {
                col.appendChild(draggedElement);
                if(taskObj) taskObj.status = newStatus;
                renderKanban(); 

                try {
                    const { error } = await supaClient.from('tasks').update({ status: newStatus }).eq('id', taskId);
                    if(error) throw error;
                } catch(err) {
                    showToast('خطا در همگام‌سازی جابجایی با سرور', 'error');
                    if(taskObj) taskObj.status = oldStatus;
                    renderKanban();
                }
            }
        }
        
        document.addEventListener('dragend', (e) => {
            if(e.target.classList) e.target.classList.remove('dragging');
            document.querySelectorAll('.kanban-column').forEach(c => c.classList.remove('drag-over'));
        });
    </script>
</body>
</html>
