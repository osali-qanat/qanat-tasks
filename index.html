<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سیستم جامع مدیریت کارهای صندوق قنات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- FontAwesome & Vazirmatn Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&display=swap');
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #f5f4f1; /* رنگ خاکی روشن */
            color: #292524;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
        
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item.active {
            background-color: #0d9488;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.4);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        .modal-overlay { background-color: rgba(28, 25, 23, 0.7); backdrop-filter: blur(4px); z-index: 100; }

        /* Kanban Specifics */
        .kanban-col { min-height: 50vh; transition: background-color 0.2s; border: 2px dashed transparent; }
        .kanban-col.drag-over { background-color: rgba(13, 148, 136, 0.05); border-color: #0d9488; }
        .task-card { cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .task-card:active { cursor: grabbing; }
        .task-card.dragging { opacity: 0.4; transform: scale(0.95) rotate(2deg); z-index: 50; }
    </style>
</head>
<body class="flex h-[100dvh] w-full overflow-hidden relative">

    <div id="toast-message" class="fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[200] text-sm font-bold transition-all duration-300 opacity-0 translate-y-[-2rem] pointer-events-none"></div>

    <div id="auth-screen" class="fixed inset-0 bg-[#f5f4f1] z-[150] flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-stone-200 relative overflow-hidden animate-fade">
            <div id="connection-status" class="absolute top-0 left-0 w-full h-1.5 bg-amber-400 animate-pulse"></div>
            
            <div class="text-center mb-8 mt-2">
                <div class="w-16 h-16 bg-gradient-to-br from-teal-500 to-teal-800 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-teal-200 transform rotate-3">
                    <i class="fa-solid fa-layer-group text-3xl text-white -rotate-3"></i>
                </div>
                <h2 class="text-2xl font-black text-stone-800">مدیریت وظایف قنات</h2>
                <p class="text-stone-500 text-sm mt-2 font-bold" id="login-subtitle">در حال اتصال به دیتابیس...</p>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-stone-700 mb-1.5">ایمیل سازمانی</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute right-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
                        <input type="email" id="email" class="w-full border-2 border-stone-200 rounded-xl py-3 pr-11 pl-4 text-left focus:border-teal-500 outline-none transition-all font-bold bg-stone-50 focus:bg-white" dir="ltr" value="osali5000@gmail.com" required disabled>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black text-stone-700 mb-1.5">رمز عبور</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute right-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
                        <input type="password" id="password" class="w-full border-2 border-stone-200 rounded-xl py-3 pr-11 pl-4 text-left focus:border-teal-500 outline-none transition-all font-bold bg-stone-50 focus:bg-white" dir="ltr" placeholder="رمز عبور خود را وارد کنید" required disabled>
                    </div>
                </div>
                <button type="submit" id="login-btn" class="w-full bg-stone-200 text-stone-400 font-black rounded-xl p-4 transition-all duration-300 flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-circle-notch fa-spin text-lg"></i> بارگذاری سیستم...
                </button>
            </form>
        </div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-stone-900/60 z-40 hidden lg:hidden transition-opacity opacity-0" onclick="toggleSidebar()"></div>

    <aside id="mainSidebar" class="fixed inset-y-0 right-0 z-50 w-64 bg-teal-950 text-stone-300 flex flex-col shadow-2xl transition-transform duration-300 transform translate-x-full lg:relative lg:translate-x-0 lg:z-20">
        <div class="p-6 border-b border-teal-900 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-teal-400 to-teal-700 rounded-xl flex items-center justify-center text-white shadow-lg shadow-teal-500/30">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h2 class="text-white font-black text-lg leading-tight">بورد پروژه‌ها</h2>
                    <p class="text-[10px] text-teal-200/60 font-bold tracking-wider">صندوق قنات</p>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-teal-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-kanban w-5"></i> بورد مدیریت کارهای جاری
            </button>
            <button class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold hover:bg-teal-900 hover:text-white" onclick="showToast('این بخش به زودی فعال می‌شود', 'info')">
                <i class="fa-solid fa-chart-line w-5"></i> گزارش عملکرد اعضا
            </button>
            <button class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold hover:bg-teal-900 hover:text-white" onclick="showToast('این بخش به زودی فعال می‌شود', 'info')">
                <i class="fa-solid fa-calendar-days w-5"></i> تقویم جلسات
            </button>
        </nav>
        
        <div class="p-4 border-t border-teal-900">
            <div class="bg-teal-900/50 rounded-xl p-3 flex items-center gap-3 border border-teal-800/50">
                <div class="w-8 h-8 rounded-full bg-teal-800 flex items-center justify-center text-teal-300 font-bold">م</div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold text-white truncate" dir="ltr" id="user-display-name">Loading...</p>
                    <p class="text-[10px] text-teal-400">مدیر سیستم</p>
                </div>
                <button onclick="handleLogout()" class="text-rose-400 hover:text-rose-300 p-2 rounded-lg hover:bg-teal-800 transition" title="خروج">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden w-full relative z-0">
        
        <header class="h-16 bg-white border-b border-stone-200 flex items-center justify-between px-3 md:px-6 flex-shrink-0 shadow-sm z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden text-stone-500 hover:text-teal-600 focus:outline-none p-2 rounded-lg bg-stone-100 flex-shrink-0">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h1 class="text-base md:text-xl font-black text-stone-800">بورد مدیریت کارهای جاری (Kanban)</h1>
            </div>
            
            <button onclick="openNewTaskModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold shadow-md shadow-teal-200 transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">ثبت وظیفه جدید</span>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm border-r-4 border-r-stone-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] md:text-xs font-bold text-stone-500 mb-1">کل وظایف سیستم</p>
                            <h3 class="text-xl md:text-2xl font-black text-stone-800" id="stat-total">0</h3>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-stone-100 text-stone-600 flex items-center justify-center"><i class="fa-solid fa-layer-group"></i></div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm border-r-4 border-r-sky-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] md:text-xs font-bold text-sky-700 mb-1">برای انجام (To-Do)</p>
                            <h3 class="text-xl md:text-2xl font-black text-sky-900" id="stat-todo">0</h3>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center"><i class="fa-regular fa-circle"></i></div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm border-r-4 border-r-amber-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] md:text-xs font-bold text-amber-700 mb-1">در دست اقدام</p>
                            <h3 class="text-xl md:text-2xl font-black text-amber-900" id="stat-inprogress">0</h3>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center"><i class="fa-solid fa-spinner fa-spin-pulse"></i></div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm border-r-4 border-r-emerald-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] md:text-xs font-bold text-emerald-700 mb-1">انجام شده / پایان</p>
                            <h3 class="text-xl md:text-2xl font-black text-emerald-900" id="stat-done">0</h3>
                        </div>
                        <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-check-double"></i></div>
                    </div>
                </div>
            </div>

            <div class="flex gap-6 h-full min-w-max pb-12">
                
                <!-- Column: To-Do -->
                <div class="w-80 flex flex-col bg-sky-50/50 rounded-2xl border border-sky-100 h-full max-h-[70vh]">
                    <div class="p-4 border-b border-sky-100 bg-sky-100/50 rounded-t-2xl flex justify-between items-center shrink-0">
                        <h3 class="font-black text-sky-900 text-sm flex items-center gap-2">
                            <i class="fa-regular fa-circle text-sky-500"></i> برای انجام (To-Do)
                        </h3>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 kanban-col" id="col-todo" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-status="todo">
                        <!-- Tasks inject here -->
                    </div>
                </div>

                <!-- Column: In Progress -->
                <div class="w-80 flex flex-col bg-amber-50/50 rounded-2xl border border-amber-100 h-full max-h-[70vh]">
                    <div class="p-4 border-b border-amber-100 bg-amber-100/50 rounded-t-2xl flex justify-between items-center shrink-0">
                        <h3 class="font-black text-amber-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-spinner text-amber-500"></i> در دست اقدام
                        </h3>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 kanban-col" id="col-inprogress" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-status="in_progress">
                        <!-- Tasks inject here -->
                    </div>
                </div>

                <!-- Column: Done -->
                <div class="w-80 flex flex-col bg-emerald-50/50 rounded-2xl border border-emerald-100 h-full max-h-[70vh]">
                    <div class="p-4 border-b border-emerald-100 bg-emerald-100/50 rounded-t-2xl flex justify-between items-center shrink-0">
                        <h3 class="font-black text-emerald-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-check-double text-emerald-500"></i> انجام شده (Done)
                        </h3>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3 kanban-col" id="col-done" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-status="done">
                        <!-- Tasks inject here -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="newTaskModal" class="fixed inset-0 hidden flex items-center justify-center modal-overlay p-4 z-[100]">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg flex flex-col overflow-hidden animate-fade">
            <div class="p-5 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                <h3 class="text-lg font-black text-stone-800" id="modalTitle"><i class="fa-solid fa-file-signature text-teal-600 ml-2"></i>تعریف وظیفه جدید</h3>
                <button onclick="closeNewTaskModal()" class="text-stone-400 hover:text-rose-500 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            
            <form id="taskForm" onsubmit="event.preventDefault(); submitTask();" class="p-6 overflow-y-auto max-h-[70vh]">
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-stone-700 mb-1.5">عنوان کار (اجباری)</label>
                        <input type="text" id="taskTitle" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:border-teal-500 outline-none font-bold text-sm bg-stone-50 focus:bg-white transition-colors" placeholder="مثال: بررسی پرونده وام آقای احمدی" required>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-stone-700 mb-1.5">توضیحات تکمیلی (اختیاری)</label>
                        <textarea id="taskDesc" rows="3" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:border-teal-500 outline-none text-xs bg-stone-50 focus:bg-white transition-colors leading-relaxed" placeholder="جزئیات بیشتر در مورد این وظیفه..."></textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-stone-700 mb-1.5">دسته‌بندی</label>
                            <select id="taskCategory" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:border-teal-500 outline-none text-sm font-bold bg-stone-50">
                                <option value="مالی و حسابداری">💰 مالی و حسابداری</option>
                                <option value="سیستم و فنی">💻 سیستم و فنی</option>
                                <option value="پشتیبانی اعضا">👥 پشتیبانی اعضا</option>
                                <option value="جلسات مدیریت">📋 جلسات مدیریت</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-stone-700 mb-1.5">اولویت انجام</label>
                            <select id="taskPriority" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:border-teal-500 outline-none text-sm font-bold bg-stone-50">
                                <option value="عادی">🟢 عادی</option>
                                <option value="مهم">🟠 مهم</option>
                                <option value="فوری">🔴 فوری و حیاتی</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-stone-700 mb-1.5">تاریخ سررسید (Deadline)</label>
                        <input type="date" id="taskDueDate" class="w-full border-2 border-stone-200 rounded-xl p-3 focus:border-teal-500 outline-none text-sm font-bold bg-stone-50 text-left" dir="ltr">
                    </div>
                </div>
            </form>
            
            <div class="p-5 border-t border-stone-100 bg-stone-50 flex flex-col sm:flex-row justify-end gap-3">
                <button type="button" onclick="closeNewTaskModal()" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-stone-600 bg-white border-2 border-stone-200 hover:bg-stone-100 transition text-sm">انصراف</button>
                <button type="submit" form="taskForm" id="btn-submit-task" class="w-full sm:w-auto px-8 py-3 rounded-xl font-bold text-white bg-teal-600 hover:bg-teal-700 shadow-lg shadow-teal-200 transition text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> ثبت در پایگاه داده
                </button>
            </div>
        </div>
    </div>

    <script>
        // UI Helpers
        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast-message');
            let icon = '<i class="fa-solid fa-circle-info"></i>';
            toast.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl z-[300] text-sm font-bold transition-all duration-300 opacity-100 translate-y-0 text-white flex items-center gap-2 ';
            
            if(type === 'error') {
                toast.className += 'bg-rose-600 border border-rose-800';
                icon = '<i class="fa-solid fa-circle-exclamation"></i>';
            } else if (type === 'success') {
                toast.className += 'bg-emerald-600 border border-emerald-800';
                icon = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                toast.className += 'bg-teal-600 border border-teal-800';
            }
            
            toast.innerHTML = icon + ' ' + message;
            setTimeout(() => {
                toast.classList.replace('opacity-100', 'opacity-0');
                toast.classList.replace('translate-y-0', 'translate-y-[-2rem]');
            }, 4000);
        }

        // Database Variables
        let supaClient = null;
        let tasksList = [];
        let currentUser = null;

        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.onload = () => {
            try {
                supaClient = window.supabase.createClient(
                    'https://fsbfdyipycoeykmhiaox.supabase.co', 
                    'sb_publishable_fSA7iR064z30VOjrjviaCg_AF7J7sYh'
                );
                
                const btn = document.getElementById('login-btn');
                btn.disabled = false;
                btn.innerHTML = 'ورود امن به پنل مدیریت <i class="fa-solid fa-arrow-left mr-2"></i>';
                btn.className = "w-full bg-teal-600 hover:bg-teal-700 text-white font-black rounded-xl p-4 transition-all duration-300 flex items-center justify-center shadow-lg shadow-teal-200 cursor-pointer text-sm";
                
                document.getElementById('email').disabled = false;
                document.getElementById('password').disabled = false;
                document.getElementById('login-subtitle').innerHTML = '<span class="text-emerald-600"><i class="fa-solid fa-shield-check"></i> ارتباط امن برقرار شد.</span>';
                document.getElementById('connection-status').className = "absolute top-0 left-0 w-full h-1.5 bg-emerald-500";

                checkSession();
            } catch (err) {
                showToast('خطا در تنظیمات پایگاه داده', 'error');
            }
        };
        script.onerror = () => {
            showToast('خطا در بارگذاری کتابخانه اصلی. لطفا اینترنت را بررسی کنید.', 'error');
            document.getElementById('login-subtitle').innerHTML = '<span class="text-rose-500">ارتباط با سرور مسدود است.</span>';
            document.getElementById('connection-status').className = "absolute top-0 left-0 w-full h-1.5 bg-rose-500";
        };
        document.head.appendChild(script);

        async function checkSession() {
            const { data: { session } } = await supaClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                initDashboard();
            }
        }

        async function handleLogin() {
            if(!supaClient) return showToast('سیستم هنوز آماده نیست!', 'error');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            
            const origClass = btn.className;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> در حال اعتبارسنجی...';
            btn.className = "w-full bg-stone-800 text-white font-black rounded-xl p-4 transition-all duration-300 flex items-center justify-center shadow-md cursor-not-allowed text-sm";
            btn.disabled = true;

            try {
                const { data, error } = await supaClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                currentUser = data.user;
                showToast('با موفقیت وارد شدید', 'success');
                setTimeout(() => { initDashboard(); }, 500);
            } catch (err) {
                showToast('خطا در ورود: ' + (err.message.includes('Invalid') ? 'رمز عبور اشتباه است' : err.message), 'error');
                btn.innerHTML = 'ورود امن به پنل مدیریت <i class="fa-solid fa-arrow-left mr-2"></i>';
                btn.className = origClass;
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            await supaClient.auth.signOut();
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('auth-screen').classList.add('flex');
            document.getElementById('password').value = '';
            currentUser = null;
        }

        function initDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('flex');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('main-dashboard').classList.add('flex');
            
            document.getElementById('user-display-name').innerText = currentUser.email;
            fetchTasks();
        }

        async function fetchTasks() {
            try {
                const { data, error } = await supaClient.from('tasks').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                
                tasksList = data;
                renderKanban();
            } catch (err) {
                showToast('خطا در دریافت لیست وظایف از سرور', 'error');
                console.error(err);
            }
        }

        function renderKanban() {
            const cols = {
                'todo': document.getElementById('col-todo'),
                'in_progress': document.getElementById('col-inprogress'),
                'done': document.getElementById('col-done')
            };
            
            cols.todo.innerHTML = ''; cols.in_progress.innerHTML = ''; cols.done.innerHTML = '';
            let counts = { todo: 0, in_progress: 0, done: 0 };

            tasksList.forEach(task => {
                let s = 'todo';
                if(task.status === 'در دست اقدام' || task.status === 'in_progress') s = 'in_progress';
                if(task.status === 'انجام شده' || task.status === 'done') s = 'done';
                
                counts[s]++;
                
                let pConfig = { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', icon: 'fa-circle-down' };
                if(task.priority === 'مهم') pConfig = { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', icon: 'fa-circle-exclamation' };
                if(task.priority === 'فوری' || task.priority === '🔴 فوری و حیاتی') pConfig = { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', icon: 'fa-fire' };

                const createdDate = task.created_at ? new Date(task.created_at).toLocaleDateString('fa-IR') : 'نامشخص';
                const dueHtml = task.due_date ? `<div class="mt-2 text-[10px] font-bold text-rose-600 bg-rose-50 inline-block px-2 py-1 rounded border border-rose-100"><i class="fa-regular fa-calendar-xmark ml-1"></i>سررسید: ${new Date(task.due_date).toLocaleDateString('fa-IR')}</div>` : '';
                const descHtml = task.description ? `<p class="text-[11px] text-stone-500 leading-relaxed mb-3 line-clamp-2">${task.description}</p>` : '';

                const cardHTML = `
                    <div id="${task.id}" class="task-card bg-white p-4 rounded-2xl border border-stone-200 shadow-sm hover:shadow-md hover:border-teal-400 relative group" draggable="true" ondragstart="drag(event)">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-[10px] font-black px-2 py-1 rounded-md border ${pConfig.bg} ${pConfig.text} ${pConfig.border} flex items-center gap-1">
                                <i class="fa-solid ${pConfig.icon}"></i> ${task.priority || 'عادی'}
                            </span>
                            <span class="text-[10px] text-stone-600 bg-stone-100 border border-stone-200 px-2 py-1 rounded font-bold">
                                ${task.category || 'عمومی'}
                            </span>
                        </div>
                        
                        <h4 class="font-black text-stone-800 text-sm leading-relaxed mb-2">${task.title}</h4>
                        ${descHtml}
                        ${dueHtml}
                        
                        <div class="flex justify-between items-end text-[10px] text-stone-400 pt-3 mt-3 border-t border-stone-100">
                            <span class="font-bold"><i class="fa-solid fa-calendar-plus ml-1"></i> ثبت: ${createdDate}</span>
                            <button onclick="deleteTask('${task.id}')" class="text-stone-400 hover:text-white transition p-1.5 rounded-lg hover:bg-rose-500 opacity-0 group-hover:opacity-100 shadow-sm" title="حذف وظیفه"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                cols[s].innerHTML += cardHTML;
            });

            document.getElementById('stat-total').innerText = tasksList.length;
            document.getElementById('stat-todo').innerText = counts.todo;
            document.getElementById('stat-inprogress').innerText = counts.in_progress;
            document.getElementById('stat-done').innerText = counts.done;
        }

        function openNewTaskModal() {
            document.getElementById('taskForm').reset();
            document.getElementById('newTaskModal').classList.remove('hidden');
        }
        
        function closeNewTaskModal() {
            document.getElementById('newTaskModal').classList.add('hidden');
        }

        async function submitTask() {
            const title = document.getElementById('taskTitle').value;
            const desc = document.getElementById('taskDesc').value;
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;
            
            const btn = document.getElementById('btn-submit-task');
            const origContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> در حال ذخیره...'; 
            btn.disabled = true;

            try {
                const newTask = {
                    title: title,
                    description: desc,
                    category: category,
                    priority: priority,
                    due_date: dueDate ? dueDate : null,
                    status: 'todo',
                    task_code: 'TSK-' + Math.floor(Math.random() * 100000)
                };
                
                const { data, error } = await supaClient.from('tasks').insert([newTask]).select();
                
                if (error) {
                    if (error.code === '42501') {
                        throw new Error('خطای دسترسی دیتابیس (RLS). لطفا کدهای SQL که داده شد را در پنل سوپابیس اجرا کنید تا اجازه ثبت وظیفه صادر شود.');
                    }
                    throw error;
                }
                
                showToast('وظیفه با موفقیت ثبت شد', 'success');
                if(data && data.length > 0) {
                     tasksList.unshift(data[0]); 
                }
                renderKanban();
                closeNewTaskModal();
                
            } catch (err) {
                showToast(err.message || 'خطا در ثبت وظیفه', 'error');
            } finally {
                btn.innerHTML = origContent; 
                btn.disabled = false;
            }
        }

        async function deleteTask(id) {
            if(!confirm('آیا از حذف این وظیفه مطمئن هستید؟ این کار غیرقابل بازگشت است.')) return;
            try {
                const { error } = await supaClient.from('tasks').delete().eq('id', id);
                
                if (error) {
                    if (error.code === '42501') throw new Error('شما دسترسی حذف وظایف را ندارید (خطای RLS). کدهای SQL باید اجرا شوند.');
                    throw error;
                }
                
                tasksList = tasksList.filter(t => t.id !== id);
                renderKanban();
                showToast('وظیفه باموفقیت حذف شد', 'success');
            } catch (err) {
                showToast(err.message || 'خطا در حذف وظیفه', 'error');
            }
        }

        let draggedTaskData = null;

        function drag(ev) {
            draggedTaskData = ev.target.id;
            ev.dataTransfer.setData("text", ev.target.id);
            ev.dataTransfer.effectAllowed = 'move';
            
            setTimeout(() => { ev.target.classList.add('dragging'); }, 0);
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.dataTransfer.dropEffect = 'move';
        }

        function dragEnter(ev) {
            ev.preventDefault();
            let col = ev.target.closest('.kanban-col');
            if(col) col.classList.add('drag-over');
        }

        function dragLeave(ev) {
            let col = ev.target.closest('.kanban-col');
            if(col) col.classList.remove('drag-over');
        }

        async function drop(ev) {
            ev.preventDefault();
            let col = ev.target.closest('.kanban-col');
            if(!col) return;
            
            col.classList.remove('drag-over');
            
            const taskId = ev.dataTransfer.getData("text") || draggedTaskData;
            if(!taskId) return;
            
            const draggedElement = document.getElementById(taskId);
            if(draggedElement) draggedElement.classList.remove('dragging');
            
            const newStatus = col.getAttribute('data-status');
            const taskObj = tasksList.find(t => t.id === taskId);
            
            let oldStatus = 'todo';
            if(taskObj) {
                if(taskObj.status === 'در دست اقدام' || taskObj.status === 'in_progress') oldStatus = 'in_progress';
                if(taskObj.status === 'انجام شده' || taskObj.status === 'done') oldStatus = 'done';
            }

            if(taskObj && oldStatus !== newStatus) {
                taskObj.status = newStatus;
                renderKanban(); 

                try {
                    const { error } = await supaClient.from('tasks').update({ status: newStatus }).eq('id', taskId);
                    if(error) throw error;
                } catch(err) {
                    showToast('خطا در ذخیره وضعیت جدید در سرور', 'error');
                    taskObj.status = oldStatus;
                    renderKanban();
                }
            }
        }
        
        document.addEventListener('dragend', (e) => {
            draggedTaskData = null;
            if(e.target.classList) e.target.classList.remove('dragging');
            document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
        });

    </script>
</body>
</html>
